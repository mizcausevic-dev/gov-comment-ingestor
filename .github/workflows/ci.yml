name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: "1.26.0"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Prerender
        run: go run ./cmd/prerender
      - name: Demo
        run: go run ./cmd/demo
      - name: Smoke
        run: go run ./cmd/smoke

