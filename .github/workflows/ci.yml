name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.26.0"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Prerender
        run: go run ./cmd/prerender
      - name: Demo
        run: go run ./cmd/demo
      - name: Smoke
        run: go run ./cmd/smoke

