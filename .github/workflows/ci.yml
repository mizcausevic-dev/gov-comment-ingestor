name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Prerender
        run: go run ./cmd/prerender
      - name: Demo
        run: go run ./cmd/demo
      - name: Smoke
        run: go run ./cmd/smoke

