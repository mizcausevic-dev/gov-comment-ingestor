name: Deploy to ingestor.kineticgain.com

# Go -> Hostinger FTP at /ingestor/
# workflow_dispatch-only: subdomain isn't in Hostinger DNS yet.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gov-comment-ingestor
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build + FTP-sync to ingestor.kineticgain.com
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Prerender
        run: go run ./cmd/prerender
      - name: Verify build output
        run: |
          test -d site || (echo "FAIL: site/ missing" && exit 1)
          test -f site/index.html || (echo "FAIL: site/index.html missing" && exit 1)
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: /ingestor/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
